<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable: safe zone is the inner 80% — keep all content within roughly x:51-461 y:51-461 -->
  <!-- Solid background (fills to edges for maskable) -->
  <rect width="512" height="512" fill="#0f172a"/>
  <!-- Wallet body -->
  <rect x="96" y="180" width="320" height="232" rx="24" fill="#1e293b" stroke="#3b82f6" stroke-width="6"/>
  <!-- Top strip -->
  <rect x="96" y="180" width="320" height="44" rx="24" fill="#1e3a5f"/>
  <rect x="96" y="204" width="320" height="20" fill="#1e3a5f"/>
  <!-- Card slot -->
  <rect x="288" y="254" width="104" height="76" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="4"/>
  <circle cx="340" cy="292" r="17" fill="#3b82f6" opacity="0.9"/>
  <text x="340" y="298" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#fff">$</text>
  <!-- Bill lines -->
  <rect x="116" y="270" width="148" height="10" rx="5" fill="#3b82f6" opacity="0.45"/>
  <rect x="116" y="295" width="112" height="10" rx="5" fill="#3b82f6" opacity="0.3"/>
  <rect x="116" y="320" width="130" height="10" rx="5" fill="#3b82f6" opacity="0.2"/>
  <!-- Trend line -->
  <polyline points="300,382 326,360 352,370 390,342" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <circle cx="390" cy="342" r="5" fill="#3b82f6" opacity="0.8"/>
</svg>
